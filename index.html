<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricco's — Halloween Mystery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #14131a; color: #f7f1e7; font: 18px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 480px; margin: 0 auto; }
    .skull-logo { display: block; width: 160px; height: 160px; object-fit: contain; margin: 0 auto 24px; }
    h1 { font: 400 clamp(36px, 9vw, 48px)/1.1 Georgia, serif; margin: 16px 0; }
    .intro { color: #c8c2ce; margin-bottom: 32px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, button { width: 100%; min-height: 54px; border-radius: 8px; font: inherit; }
    input { padding: 12px 16px; border: 1px solid #81788b; background: #211e29; color: #fff; }
    button { margin-top: 14px; padding: 12px 16px; border: 0; background: #efb575; color: #21180d; font-weight: 700; cursor: pointer; }
    button:hover { background: #ffca8d; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    #response, #current-clue { margin-top: 28px; padding: 20px; border-left: 3px solid #efb575; background: #211e29; white-space: pre-wrap; overflow-wrap: anywhere; }
    #restart { display: block; width: auto; min-height: 44px; margin: 32px auto 0; padding: 8px 16px; background: transparent; color: #c8c2ce; border: 1px solid #81788b; font-size: 14px; font-weight: 400; }
    #storage-note { font-size: 14px; color: #c8c2ce; }
    #response:empty { display: none; }
    #response[data-error="true"] { border-color: #ffa5a5; }
    [hidden] { display: none !important; }
    body.is-complete { background: #eee0c5; color: #302218; }
    body.is-complete #restart { color: #302218; border-color: #8b6236; }
    body.is-complete #restart:focus-visible { outline-color: #302218; }
    body.is-complete main { max-width: 640px; }
    #final-clue { min-height: calc(100svh - 96px); padding: clamp(24px, 6vw, 48px); border: 1px solid #8b6236; outline: 1px solid #8b6236; outline-offset: -8px; display: flex; flex-direction: column; justify-content: center; }
    #final-clue h1 { font-size: clamp(44px, 11vw, 68px); margin: 0 0 28px; }
    #final-clue-text { white-space: pre-wrap; overflow-wrap: anywhere; font: 22px/1.7 Georgia, serif; }
    #answer-form { margin-top: 32px; }
    #answer-label { font-size: 18px; font-weight: 400; }
    #killer-answer { background: #fffaf0; color: #302218; border-color: #8b6236; }
    #answer-submit { background: #302218; color: #fffaf0; }
    #answer-submit:disabled { opacity: .65; cursor: wait; }
    #answer-response { margin-bottom: 0; }
    #final-clue :focus-visible { outline-color: #302218; }
  </style>
</head>
<body>
  <main>
    <div id="game-screen">
    <img class="skull-logo" src="skull-white.png?v=exact" alt="Ricco’s skull" width="160" height="160">
    <h1>Solve the Mystery</h1>
    <p class="intro">Found a code? Enter it below to reveal your clue.</p>
    <p id="progress" role="status" aria-live="polite"></p>
    <p id="storage-note" hidden></p>
    <div id="current-clue" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <form id="clue-form" novalidate>
      <label for="code">Your code</label>
      <input id="code" name="code" type="text" placeholder="Enter code" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="response">
      <button type="submit">Reveal clue</button>
    </form>
    <div id="response" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript><p>Please enable JavaScript to reveal clues.</p></noscript>
    </div>
    <section id="final-clue" aria-labelledby="final-clue-heading" hidden>
      <h1 id="final-clue-heading" tabindex="-1">Final clue</h1>
      <div id="final-clue-text"></div>
      <form id="answer-form" novalidate>
        <label id="answer-label" for="killer-answer"></label>
        <input id="killer-answer" type="text" autocomplete="off" maxlength="200" aria-describedby="answer-response">
        <button id="answer-submit" type="submit">Submit answer</button>
      </form>
      <p id="answer-response" role="status" aria-live="polite"></p>
    </section>
    <button id="restart" type="button" hidden>Reset progress</button>
  </main>
  <script>
    // Clue content lives only in clues.json. Edit that file, not this script.
    (async () => {
      const el = id => document.getElementById(id);
      const form = el("clue-form"), input = el("code"), response = el("response");
      const progress = el("progress"), currentClue = el("current-clue");
      const ending = el("final-clue"), endingText = el("final-clue-text");
      const gameScreen = el("game-screen"), restart = el("restart");
      const storageNote = el("storage-note");
      const answerForm = el("answer-form"), answerInput = el("killer-answer");
      const answerResponse = el("answer-response"), answerSubmit = el("answer-submit");
      let notifying = false, notified = false;
      const normalize = code => code.trim().replace(/\s+/g, " ").toUpperCase();
      let ready = false, found = [], data, byId, storageKey;
      form.hidden = true;
      progress.textContent = "Loading clues…";
      function announce(message, error = false) {
        response.textContent = message;
        response.dataset.error = String(error);
        input.setAttribute("aria-invalid", String(error));
      }
      function storageUnavailable() {
        storageNote.hidden = false;
        storageNote.textContent = "This browser cannot save progress. Keep this page open while playing.";
      }
      function save() {
        try { localStorage.setItem(storageKey, JSON.stringify(found)); }
        catch { storageUnavailable(); }
      }
      function render() {
        const complete = found.length === data.clues.length;
        const last = found.length ? byId.get(found[found.length - 1]) : null;
        progress.textContent = found.length + " of " + data.clues.length + " clues found";
        currentClue.hidden = !last;
        currentClue.textContent = last ? "Clue found: " + byId.get(last.next).clue : "";
        ending.hidden = !complete;
        endingText.textContent = complete ? data.finalClue : "";
        el("answer-label").textContent = data.finalAnswerPrompt;
        answerForm.hidden = notified;
        if (notified) answerResponse.textContent = data.successMessage;
        else if (!notifying) answerResponse.textContent = "";
        gameScreen.hidden = complete;
        form.hidden = complete;
        document.body.classList.toggle("is-complete", complete);
        restart.hidden = found.length === 0;
        if (complete) el("final-clue-heading").focus();
      }
      form.addEventListener("submit", event => {
        event.preventDefault();
        if (!ready) return;
        const code = normalize(input.value);
        if (!code) return announce("Please enter a code.", true);
        const clue = data.clues.find(c => c.code !== null && normalize(c.code) === code);
        if (!clue) return announce("Code not recognised. Check it and try again.", true);
        if (found.includes(clue.id)) return announce("You have already found that clue. Follow your current clue above.");
        found.push(clue.id);
        save();
        render();
        input.value = "";
        announce("");
      });
      answerForm.addEventListener("submit", async event => {
        event.preventDefault();
        if (!ready || notifying || found.length !== data.clues.length) return;
        const answer = normalize(answerInput.value);
        if (!answer) { answerResponse.textContent = "Please enter your answer."; return; }
        if (!data.acceptedAnswers.some(value => normalize(value) === answer)) {
          answerResponse.textContent = "Not quite. Take another look at the clues and try again.";
          return;
        }
        if (notified) { answerResponse.textContent = data.successMessage; return; }
        if (!data.notificationEmail) { answerResponse.textContent = data.successMessage + " Please tell the host in person."; return; }
        notifying = true;
        answerSubmit.disabled = true;
        answerResponse.textContent = data.successMessage + " Notifying the host…";
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
          const result = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(data.notificationEmail), {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            signal: controller.signal,
            body: JSON.stringify({
              _subject: "Ricco's mystery — correct answer",
              answer: answerInput.value.trim(),
              message: "A player has found all clues and correctly identified the panther.",
              clues_found: found.length,
              submitted_at: new Date().toISOString(),
              game: data.gameVersion
            })
          });
          const receipt = await result.json();
          if (!result.ok || !(receipt.success === true || receipt.success === "true")) throw Error("Notification rejected");
          notified = true;
          try { localStorage.setItem(storageKey + ":notified", "yes"); } catch {}
          answerResponse.textContent = data.successMessage;
          answerForm.hidden = true;
        } catch {
          answerResponse.textContent = data.successMessage + " We couldn't notify the host. Press Submit answer to retry, or tell the host in person.";
        } finally {
          clearTimeout(timeout);
          notifying = false;
          answerSubmit.disabled = false;
        }
      });
      restart.addEventListener("click", () => {
        if (!ready || notifying || !window.confirm("Reset all progress on this device? This clears every found clue and starts the mystery again.")) return;
        found = [];
        notified = false;
        answerInput.value = "";
        answerResponse.textContent = "";
        try { localStorage.removeItem(storageKey + ":notified"); } catch {}
        save();
        render();
        input.value = "";
        announce("");
        input.focus();
      });
      try {
        const result = await fetch("./clues.json", { cache: "no-store" });
        if (!result.ok) throw Error("Could not load clues.json");
        data = await result.json();
        if (!data || typeof data.gameVersion !== "string" || !data.gameVersion.trim() ||
            typeof data.finalClue !== "string" || !data.finalClue.trim() ||
            !Array.isArray(data.clues) || !data.clues.length) throw Error("Invalid game settings");
        if (typeof data.finalAnswerPrompt !== "string" ||
            typeof data.successMessage !== "string" ||
            !Array.isArray(data.acceptedAnswers) || !data.acceptedAnswers.length ||
            data.acceptedAnswers.some(a => typeof a !== "string" || !normalize(a)) ||
            (data.notificationEmail !== undefined && (typeof data.notificationEmail !== "string" || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.notificationEmail))))
          throw Error("Invalid final answer settings");
        const ids = new Set(), codes = new Set();
        for (const c of data.clues) {
          if (!c || typeof c.id !== "string" || !c.id.trim() || ids.has(c.id) ||
              typeof c.clue !== "string" || !c.clue.trim() || typeof c.next !== "string" ||
              typeof c.starter !== "boolean") throw Error("Invalid clue");
          ids.add(c.id);
          if (c.code !== null) {
            if (typeof c.code !== "string" || !normalize(c.code) || codes.has(normalize(c.code)))
              throw Error("Invalid or duplicate code");
            codes.add(normalize(c.code));
          }
        }
        byId = new Map(data.clues.map(c => [c.id, c]));
        if (data.clues.some(c => !byId.has(c.next)) || !data.clues.some(c => c.starter))
          throw Error("Missing next clue or starter");
        const visited = new Set();
        let next = data.clues[0].id;
        while (!visited.has(next)) { visited.add(next); next = byId.get(next).next; }
        if (visited.size !== data.clues.length || next !== data.clues[0].id)
          throw Error("Clues must form one circular route");
        storageKey = "riccos-mystery:" + data.gameVersion + ":" +
          JSON.stringify(data.clues.map(c => [c.id, c.code, c.next]));
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          if (Array.isArray(saved)) found = [...new Set(saved.filter(id => byId.has(id)))];
          notified = localStorage.getItem(storageKey + ":notified") === "yes";
        } catch { storageUnavailable(); }
        ready = true;
        render();
      } catch (error) {
        progress.textContent = "";
        announce("The clues could not be loaded. Please reload the page or ask the host to check clues.json.", true);
        console.error("Clue configuration:", error);
      }
    })();
  </script>
</body>
</html>
